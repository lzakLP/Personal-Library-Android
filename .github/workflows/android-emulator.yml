name: Android build and emulator smoke test

on:
  push:
    branches:
      - feature/android-app-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Boot emulator, install and launch app
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.lzaklp.personallibrary/.MainActivity
            sleep 5
            adb shell pidof com.lzaklp.personallibrary
